<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 80" width="440" height="80">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Hanken+Grotesk:wght@500;600&amp;display=swap');
      .wordmark { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 38px; fill: #FFFFFF; letter-spacing: -0.01em; }
      .amp { font-style: italic; fill: #C4A263; }
      .tagline { font-family: 'Hanken Grotesk', system-ui, sans-serif; font-weight: 500; font-size: 9px; fill: rgba(255,255,255,0.65); letter-spacing: 0.26em; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Compass rose mark -->
  <g transform="translate(10, 16)">
    <circle cx="24" cy="24" r="22" fill="none" stroke="#FFFFFF" stroke-width="0.9"/>
    <polygon points="24,5 26,23 24,24 22,23" fill="#FFFFFF"/>
    <polygon points="43,24 25,26 24,24 25,22" fill="#FFFFFF"/>
    <polygon points="24,43 22,25 24,24 26,25" fill="#FFFFFF"/>
    <polygon points="5,24 23,22 24,24 23,26" fill="#FFFFFF"/>
    <circle cx="24" cy="24" r="1.8" fill="#C4A263"/>
  </g>

  <text x="80" y="45" class="wordmark">Cardinal <tspan class="amp">&amp;</tspan> Oak</text>
  <text x="80" y="63" class="tagline">A Connecticut Home-Buying Firm</text>
</svg>
