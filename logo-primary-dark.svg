<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 80" width="440" height="80">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Hanken+Grotesk:wght@500;600&amp;display=swap');
      .wordmark { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 38px; fill: #0A1128; letter-spacing: -0.01em; }
      .amp { font-style: italic; fill: #9A7A3C; }
      .tagline { font-family: 'Hanken Grotesk', system-ui, sans-serif; font-weight: 500; font-size: 9px; fill: #5F6576; letter-spacing: 0.26em; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Compass rose mark -->
  <g transform="translate(10, 16)">
    <!-- Outer circle -->
    <circle cx="24" cy="24" r="22" fill="none" stroke="#0A1128" stroke-width="0.9"/>
    <!-- North spike -->
    <polygon points="24,5 26,23 24,24 22,23" fill="#0A1128"/>
    <!-- East spike -->
    <polygon points="43,24 25,26 24,24 25,22" fill="#0A1128"/>
    <!-- South spike -->
    <polygon points="24,43 22,25 24,24 26,25" fill="#0A1128"/>
    <!-- West spike -->
    <polygon points="5,24 23,22 24,24 23,26" fill="#0A1128"/>
    <!-- Gold center dot -->
    <circle cx="24" cy="24" r="1.8" fill="#9A7A3C"/>
  </g>

  <!-- Wordmark -->
  <text x="80" y="45" class="wordmark">Cardinal <tspan class="amp">&amp;</tspan> Oak</text>

  <!-- Tagline -->
  <text x="80" y="63" class="tagline">A Connecticut Home-Buying Firm</text>
</svg>
